# ── 模型 ────────────────────────────────────────────────────────────────────
model_path: /home/jovyan/data03/search_public/xby/models/Qwen3-VL-Reranker-8B
variant_name: qwen_dpo_v2

# ── LoRA ─────────────────────────────────────────────────────────────────────
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# ── DPO ──────────────────────────────────────────────────────────────────────
beta: 0.1
beta_anchor: 0.01
instruction: "Retrieve the most relevant video clip for the given query."

# ── 视频帧 ───────────────────────────────────────────────────────────────────
video_root: /home/jovyan/data03
frame_cache_dir: judge/training_data/frame_cache
total_pixels: 10485760

# ── 数据 ─────────────────────────────────────────────────────────────────────
# dpo_train.py 从 splits_dir/train_pairs.jsonl 加载
splits_dir: train/dpo_v2

# ── 训练超参 ─────────────────────────────────────────────────────────────────
lr: 5.0e-6
warmup_steps: 20
max_steps: 1200           # ~6.8k pairs, batch=16 → ~425 steps/epoch, ~2.8 epoch
batch_size_per_gpu: 1
grad_accum: 8             # effective batch = 16 pairs (2 GPU)
max_seq_len: 4096
gradient_checkpointing: true
bf16: true
save_steps: 200           # 共 6 个 checkpoint

# ── 输出路径（相对项目根）────────────────────────────────────────────────────
output_dir: train/checkpoints/qwen_dpo_v2
log_dir: train/logs/qwen_dpo_v2
